services:

  postgres:
    build: ./postgres
    container_name: postgres_db
    #user: "999:999"  # Usuário postgres no Alpine (UID 999)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./postgres/logs:/var/log/postgresql
      - ./postgres/conf:/etc/postgresql-custom
      - ./.env:/docker-entrypoint-initdb.d/.env:ro
    entrypoint: >
          sh -c "
          chown -R postgres:postgres /var/log/postgresql &&
          chmod -R 700 /var/log/postgresql &&
          exec docker-entrypoint.sh postgres 
          -c logging_collector=on 
          -c log_directory=/var/log/postgresql 
          -c log_filename=postgresql.log 
          -c log_file_mode=0666"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    container_name: keycloak_service
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_BD:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_USU:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_SEN:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_LOG: "console,file"
      KC_LOG_FILE: /opt/keycloak/logs/keycloak.log
      KC_LOG_LEVEL: INFO
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
    volumes:
      - ./keycloak/conf:/opt/keycloak/conf
      - ./keycloak/logs:/opt/keycloak/logs
      - ./keycloak/data/import:/opt/keycloak/data/import:ro
      - ./keycloak/providers:/opt/keycloak/providers:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  motor-biometrico:
    build: 
      context: ./biometria
      dockerfile: Dockerfile
    container_name: seagri_biometria
    ports:
      - "8000:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=-1
      - TF_CPP_MIN_LOG_LEVEL=2
      - TF_ENABLE_ONEDNN_OPTS=0  # Para evitar warnings de otimização
      - TZ=America/Sao_Paulo # Mantém o fuso horário alinhado
    # Em produção, você pode limitar o uso de CPU/RAM aqui, 
    # pois IA consome processamento, preservando o banco de dados.
    volumes:
      - ./biometria/logs:/app/logs
    restart: unless-stopped

