services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./postgres/logs:/var/log/postgresql
      - ./postgres/conf:/etc/postgresql-custom
      - ./.env:/docker-entrypoint-initdb.d/.env:ro
#    command: >
#      postgres
#      -c logging_collector=on
#      -c log_directory=/var/log/postgresql
#      -c log_filename=postgresql.log
#      -c log_file_mode=0666
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak_service
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_BD:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_USU:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_SEN:-keycloak}
      KC_HOSTNAME: localhost
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_LOG: file
      KC_LOG_FILE: /opt/keycloak/logs/keycloak.log
    volumes:
      - ./keycloak/conf:/opt/keycloak/conf
      - ./keycloak/logs:/opt/keycloak/logs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  motor-biometrico:
    build: 
      context: ./biometria
      dockerfile: Dockerfile
    container_name: seagri_biometria
    ports:
      - "8000:8000"
    environment:
      - TZ=America/Sao_Paulo # Mantém o fuso horário alinhado
    # Em produção, você pode limitar o uso de CPU/RAM aqui, 
    # pois IA consome processamento, preservando o banco de dados.
    restart: unless-stopped
